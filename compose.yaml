name: postgresql-advisor

services:
  source-db:
    build:
      context: .
      dockerfile: deployment/postgres/Dockerfile
    image: postgresql-advisor/powa-postgres:18-5.2.0-qualstats-2.1.4-kcache-2.3.2-waits-1.1.11-hypopg-1.4.3
    shm_size: ${SOURCE_DB_SHM_SIZE:-256mb}
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-advisor_dev_admin}
      POWA_COLLECTOR_PASSWORD: ${POWA_COLLECTOR_PASSWORD:-advisor_dev_collector}
      ADVISOR_EVALUATOR_PASSWORD: ${ADVISOR_EVALUATOR_PASSWORD:-advisor_dev_evaluator}
      ADVISOR_JOIN_SOURCE_PASSWORD: ${ADVISOR_JOIN_SOURCE_PASSWORD:-advisor_dev_join_source}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements,pg_qualstats,pg_stat_kcache,pg_wait_sampling
      - -c
      - compute_query_id=on
      - -c
      - pg_stat_statements.track=all
      - -c
      - pg_stat_statements.max=10000
      - -c
      - pg_stat_statements.save=on
      - -c
      - pg_qualstats.track_constants=off
      - -c
      - pg_qualstats.track_pg_catalog=off
      - -c
      - pg_qualstats.resolve_oids=off
      - -c
      - pg_qualstats.max=${PG_QUALSTATS_MAX:-10000}
      - -c
      - pg_qualstats.sample_rate=${PG_QUALSTATS_SAMPLE_RATE:-0.1}
      - -c
      - pg_stat_kcache.track=top
      - -c
      - pg_stat_kcache.track_planning=off
      - -c
      - pg_wait_sampling.profile_period=${PG_WAIT_SAMPLING_PROFILE_PERIOD_MS:-10}
      - -c
      - pg_wait_sampling.profile_pid=off
      - -c
      - pg_wait_sampling.profile_queries=top
      - -c
      - pg_wait_sampling.sample_cpu=off
      - -c
      - track_io_timing=on
      - -c
      - powa.ignored_users=powa_collector,advisor_evaluator,advisor_join_reader
    ports:
      - "${SOURCE_DB_BIND:-127.0.0.1}:${SOURCE_DB_PORT:-15432}:5432"
    volumes:
      - source_data:/var/lib/postgresql
      - ./deployment/source/init-source.sh:/docker-entrypoint-initdb.d/10-init-source.sh:ro,Z
      - ./sql/003_join_snapshot_source.sql:/opt/advisor/sql/003_join_snapshot_source.sql:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appdb -p 5432 && psql -U postgres -d powa -Atqc \"SELECT extversion FROM pg_extension WHERE extname='powa'\" | grep -q '^5.2.0$'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    networks: [collector_source, evaluator_source, join_source, workload_source]

  repository-db:
    image: postgresql-advisor/powa-postgres:18-5.2.0-qualstats-2.1.4-kcache-2.3.2-waits-1.1.11-hypopg-1.4.3
    environment:
      PGPORT: 5433
      POSTGRES_DB: powa_repository
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-advisor_dev_admin}
      POWA_COLLECTOR_PASSWORD: ${POWA_COLLECTOR_PASSWORD:-advisor_dev_collector}
      ADVISOR_API_PASSWORD: ${ADVISOR_API_PASSWORD:-advisor_dev_api}
      ADVISOR_JOIN_REPOSITORY_PASSWORD: ${ADVISOR_JOIN_REPOSITORY_PASSWORD:-advisor_dev_join_repository}
      JOIN_SOURCE_ALIAS: ${JOIN_SOURCE_ALIAS:-test-source}
      REGISTER_DEMO_SOURCE: ${REGISTER_DEMO_SOURCE:-true}
      # register-source preflight/prepare psql komutlari icin; PGSSLMODE adi
      # kullanilmaz, aksi halde repository healthcheck baglantisi da etkilenir.
      POWA_SOURCE_SSLMODE: ${POWA_SOURCE_SSLMODE:-prefer}
    command: ["postgres", "-p", "5433"]
    ports:
      - "${REPOSITORY_DB_BIND:-127.0.0.1}:${REPOSITORY_DB_PORT:-15433}:5433"
    volumes:
      - repository_data:/var/lib/postgresql
      - ./deployment/repository/init-repository.sh:/docker-entrypoint-initdb.d/10-init-repository.sh:ro,Z
      - ./sql:/opt/advisor/sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d powa_repository -p 5433 && psql -U postgres -d powa_repository -p 5433 -Atqc \"SELECT extversion FROM pg_extension WHERE extname='powa'\" | grep -q '^5.2.0$'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [advisor, join_repository]

  repository-migrate:
    image: postgresql-advisor/powa-postgres:18-5.2.0-qualstats-2.1.4-kcache-2.3.2-waits-1.1.11-hypopg-1.4.3
    command: ["/opt/advisor/bin/run-migrations.sh"]
    user: postgres
    environment:
      PGHOST: repository-db
      PGPORT: "5433"
      PGDATABASE: powa_repository
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD:-advisor_dev_admin}
      JOIN_SOURCE_ALIAS: ${JOIN_SOURCE_ALIAS:-test-source}
      MIGRATION_LOCK_TIMEOUT_SECONDS: ${MIGRATION_LOCK_TIMEOUT_SECONDS:-60}
    volumes:
      - ./deployment/repository/run-migrations.sh:/opt/advisor/bin/run-migrations.sh:ro,Z
      - ./sql:/opt/advisor/sql:ro,z
    depends_on:
      repository-db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 128m
    restart: "no"
    networks: [advisor]

  collector:
    build:
      context: .
      dockerfile: deployment/collector/Dockerfile
    image: postgresql-advisor/powa-collector:1.3.2
    environment:
      POWA_COLLECTOR_PASSWORD: ${POWA_COLLECTOR_PASSWORD:-advisor_dev_collector}
      # Repository Docker aginda SSL kullanmaz; dis kaynaklar ortak libpq
      # sslmode ayarini kullanir. Uretimde kaynaklar TLS ise require/verify-full.
      POWA_REPOSITORY_DSN: postgresql://powa_collector@repository-db:5433/powa_repository?sslmode=disable
      PGSSLMODE: ${POWA_SOURCE_SSLMODE:-prefer}
      POWA_SOURCE_HOST: source-db
      POWA_SOURCE_PORT: "5432"
      POWA_SOURCE_DB: powa
      POWA_REPOSITORY_HOST: repository-db
      POWA_REPOSITORY_PORT: "5433"
      POWA_REPOSITORY_DB: powa_repository
    volumes:
      - ./runtime/collector/sources:/run/advisor-source-secrets:ro,Z
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      source-db:
        condition: service_healthy
      repository-db:
        condition: service_healthy
      repository-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,signal; os.kill(1, signal.SIGCONT)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks: [advisor, collector_source]

  join-snapshotter:
    build:
      context: .
      dockerfile: deployment/join-snapshotter/Dockerfile
    image: postgresql-advisor/join-snapshotter:iteration-2.5
    environment:
      JOIN_SOURCE_ALIAS: ${JOIN_SOURCE_ALIAS:-test-source}
      JOIN_SOURCE_DATABASE_URL: postgresql://advisor_join_reader:${ADVISOR_JOIN_SOURCE_PASSWORD:-advisor_dev_join_source}@source-db:5432/powa?sslmode=disable
      JOIN_REPOSITORY_DATABASE_URL: postgresql://advisor_join_ingest:${ADVISOR_JOIN_REPOSITORY_PASSWORD:-advisor_dev_join_repository}@repository-db:5433/powa_repository?sslmode=disable
      JOIN_POLL_INTERVAL_SECONDS: ${JOIN_POLL_INTERVAL_SECONDS:-2}
      JOIN_BATCH_LIMIT: ${JOIN_BATCH_LIMIT:-20}
      JOIN_RETENTION_DAYS: ${JOIN_RETENTION_DAYS:-30}
      JOIN_STATEMENT_TIMEOUT_MS: ${JOIN_STATEMENT_TIMEOUT_MS:-30000}
      JOIN_HEALTH_MAX_AGE_SECONDS: ${JOIN_HEALTH_MAX_AGE_SECONDS:-60}
    depends_on:
      source-db:
        condition: service_healthy
      repository-db:
        condition: service_healthy
      repository-migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    healthcheck:
      test: ["CMD", "python", "/app/snapshotter.py", "--healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: ${JOIN_HEALTH_START_PERIOD:-30s}
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 128m
    stop_grace_period: 35s
    restart: unless-stopped
    networks: [join_repository, join_source]

  api:
    build:
      context: ./backend
    image: postgresql-advisor/api:iteration-2.7
    environment:
      DATABASE_URL: postgresql://advisor_api:${ADVISOR_API_PASSWORD:-advisor_dev_api}@repository-db:5433/powa_repository
      DEFAULT_WINDOW: ${DEFAULT_WINDOW:-24h}
      MAX_QUERY_PAGE_SIZE: "200"
      RETENTION_DAYS: ${RETENTION_DAYS:-90}
      SQL_TEXT_VISIBILITY: authorized
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      EVALUATOR_URL: http://evaluator:8010
      EVALUATOR_TOKEN: ${EVALUATOR_TOKEN:-advisor-dev-evaluator-token}
      EVALUATOR_TIMEOUT_SECONDS: ${EVALUATOR_TIMEOUT_SECONDS:-4}
      CLONE_EVALUATOR_URL: http://clone-evaluator:8020
      CLONE_EVALUATOR_TOKEN: ${CLONE_EVALUATOR_TOKEN:-advisor-dev-clone-evaluator-token}
      CLONE_EVALUATOR_TIMEOUT_SECONDS: ${CLONE_EVALUATOR_TIMEOUT_SECONDS:-90}
      # Bos registry annotation/export/runtime endpointlerini fail-closed tutar.
      # Yalniz token SHA-256 hashleri API ortaminda saklanir.
      ADVISOR_AUTH_PRINCIPALS: '${ADVISOR_AUTH_PRINCIPALS:-[]}'
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      repository-db:
        condition: service_healthy
      repository-migrate:
        condition: service_completed_successfully
      collector:
        condition: service_started
      evaluator:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    networks: [advisor, evaluator_control, clone_control]

  evaluator:
    build:
      context: ./backend
    image: postgresql-advisor/api:iteration-2.7
    command: ["uvicorn", "app.evaluator:app", "--host", "0.0.0.0", "--port", "8010"]
    environment:
      EVALUATOR_DATABASE_URL: postgresql://advisor_evaluator:${ADVISOR_EVALUATOR_PASSWORD:-advisor_dev_evaluator}@source-db:5432/appdb
      EVALUATOR_ALLOWED_SERVER_ALIAS: ${EVALUATOR_ALLOWED_SERVER_ALIAS:-test-source}
      EVALUATOR_ALLOWED_DATABASE: ${EVALUATOR_ALLOWED_DATABASE:-appdb}
      EVALUATOR_TOKEN: ${EVALUATOR_TOKEN:-advisor-dev-evaluator-token}
      EVALUATOR_STATEMENT_TIMEOUT_MS: ${EVALUATOR_STATEMENT_TIMEOUT_MS:-2000}
      EVALUATOR_LOCK_TIMEOUT_MS: ${EVALUATOR_LOCK_TIMEOUT_MS:-250}
      EVALUATOR_MIN_IMPROVEMENT_PERCENT: ${EVALUATOR_MIN_IMPROVEMENT_PERCENT:-10}
    depends_on:
      source-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    restart: unless-stopped
    networks: [evaluator_control, evaluator_source]

  clone-db:
    image: postgresql-advisor/powa-postgres:18-5.2.0-qualstats-2.1.4-kcache-2.3.2-waits-1.1.11-hypopg-1.4.3
    profiles: [real-validation]
    shm_size: ${CLONE_DB_SHM_SIZE:-256mb}
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: clone_admin
      POSTGRES_PASSWORD: ${CLONE_ADMIN_PASSWORD:-advisor_dev_clone_admin}
      POWA_COLLECTOR_PASSWORD: ${CLONE_POWA_COLLECTOR_PASSWORD:-advisor_dev_clone_collector}
      ADVISOR_EVALUATOR_PASSWORD: ${CLONE_HYPOPG_PASSWORD:-advisor_dev_clone_hypopg}
      ADVISOR_JOIN_SOURCE_PASSWORD: ${CLONE_JOIN_SOURCE_PASSWORD:-advisor_dev_clone_join}
      CLONE_RUNNER_PASSWORD: ${CLONE_RUNNER_PASSWORD:-advisor_dev_clone_runner}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements,pg_qualstats,pg_stat_kcache,pg_wait_sampling
      - -c
      - advisor.validation_clone=on
      - -c
      - compute_query_id=on
      - -c
      - pg_qualstats.sample_rate=0.1
      - -c
      - pg_stat_kcache.track=top
      - -c
      - pg_wait_sampling.profile_queries=top
      - -c
      - pg_wait_sampling.sample_cpu=off
      # Values are restricted to SYNTHETIC/ANONYMIZED fixtures. Suppress any
      # failed-statement or bind text in this isolated clone's Docker logs too.
      - -c
      - log_statement=none
      - -c
      - log_min_error_statement=panic
      - -c
      - log_parameter_max_length_on_error=0
    tmpfs:
      - /var/lib/postgresql:rw,nosuid,nodev,size=${CLONE_DATA_TMPFS_SIZE:-1g}
    volumes:
      - ./deployment/source/init-source.sh:/docker-entrypoint-initdb.d/10-init-source.sh:ro,Z
      - ./sql/003_join_snapshot_source.sql:/opt/advisor/sql/003_join_snapshot_source.sql:ro,Z
      - ./deployment/clone/init-clone.sh:/docker-entrypoint-initdb.d/20-init-clone.sh:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clone_admin -d postgres -p 5432 && psql -U clone_admin -d postgres -Atqc \"SELECT current_setting('advisor.validation_clone', true) = 'on' AND EXISTS (SELECT 1 FROM pg_database WHERE datname='appdb' AND datistemplate)\" | grep -q '^t$'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    cap_drop: [ALL]
    # Official postgres entrypoint starts as root only long enough to prepare
    # the fresh tmpfs data/socket directories, then drops to postgres.  Keep
    # exactly the ownership and uid/gid transition capabilities it needs.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    restart: "no"
    networks: [clone_data]

  clone-evaluator:
    build:
      context: .
      dockerfile: deployment/clone-evaluator/Dockerfile
    image: postgresql-advisor/clone-evaluator:iteration-2.7
    profiles: [real-validation]
    environment:
      CLONE_DATABASE_URL: postgresql://clone_admin:${CLONE_ADMIN_PASSWORD:-advisor_dev_clone_admin}@clone-db:5432/postgres?sslmode=disable
      CLONE_TEMPLATE_DATABASE: appdb
      CLONE_ADMIN_ROLE: clone_admin
      CLONE_RUNNER_ROLE: clone_runner
      CLONE_RUNNER_PASSWORD: ${CLONE_RUNNER_PASSWORD:-advisor_dev_clone_runner}
      CLONE_EVALUATOR_TOKEN: ${CLONE_EVALUATOR_TOKEN:-advisor-dev-clone-evaluator-token}
      CLONE_STATEMENT_TIMEOUT_MS: ${CLONE_STATEMENT_TIMEOUT_MS:-10000}
      CLONE_LOCK_TIMEOUT_MS: ${CLONE_LOCK_TIMEOUT_MS:-1000}
      CLONE_TRANSACTION_TIMEOUT_MS: ${CLONE_TRANSACTION_TIMEOUT_MS:-15000}
      CLONE_WARMUP_RUNS: ${CLONE_WARMUP_RUNS:-1}
      CLONE_MEASURED_RUNS: ${CLONE_MEASURED_RUNS:-5}
      CLONE_MIN_IMPROVEMENT_PERCENT: ${CLONE_MIN_IMPROVEMENT_PERCENT:-10}
    depends_on:
      clone-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    restart: "no"
    networks: [clone_control, clone_data]

  workload:
    build:
      context: ./deployment/workload
    image: postgresql-advisor/workload:realistic-v1
    environment:
      DATABASE_URL: postgresql://advisor_workload_login@source-db:5432/appdb?sslmode=disable
      PGPASSWORD: ${WORKLOAD_DB_PASSWORD:-advisor_dev_workload}
      WORKLOAD_PROFILE: ${WORKLOAD_PROFILE:-normal}
      WORKLOAD_DURATION_SECONDS: ${WORKLOAD_DURATION_SECONDS:-0}
      WORKLOAD_INTERVAL_SECONDS: ${WORKLOAD_INTERVAL_SECONDS:-0.25}
      WORKLOAD_WORKERS: ${WORKLOAD_WORKERS:-6}
      WORKLOAD_REPORT_INTERVAL_SECONDS: ${WORKLOAD_REPORT_INTERVAL_SECONDS:-10}
      WORKLOAD_RANDOM_SEED: ${WORKLOAD_RANDOM_SEED:-20260725}
      WORKLOAD_STATEMENT_TIMEOUT_MS: ${WORKLOAD_STATEMENT_TIMEOUT_MS:-15000}
      WORKLOAD_LOCK_TIMEOUT_MS: ${WORKLOAD_LOCK_TIMEOUT_MS:-5000}
      WORKLOAD_LOCK_HOLD_MS: ${WORKLOAD_LOCK_HOLD_MS:-75}
      WORKLOAD_MAX_MUTATION_ROWS: ${WORKLOAD_MAX_MUTATION_ROWS:-10000}
      WORKLOAD_MUTATION_CLEANUP_BATCH: ${WORKLOAD_MUTATION_CLEANUP_BATCH:-250}
      WORKLOAD_MAX_EVENT_ROWS: ${WORKLOAD_MAX_EVENT_ROWS:-20000}
      WORKLOAD_EVENT_CLEANUP_BATCH: ${WORKLOAD_EVENT_CLEANUP_BATCH:-250}
      WORKLOAD_CONNECT_TIMEOUT_SECONDS: ${WORKLOAD_CONNECT_TIMEOUT_SECONDS:-5}
    depends_on:
      source-db:
        condition: service_healthy
    profiles: [realistic-load]
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 160
    mem_limit: 1g
    stop_grace_period: 30s
    restart: "no"
    networks: [workload_source]

  web:
    build:
      context: ./frontend
    image: postgresql-advisor/web:iteration-2.7
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped
    networks: [advisor]

networks:
  advisor:
    driver: bridge
  evaluator_control:
    driver: bridge
    internal: true
  evaluator_source:
    driver: bridge
    internal: true
  collector_source:
    driver: bridge
  join_source:
    driver: bridge
    internal: true
  join_repository:
    driver: bridge
    internal: true
  workload_source:
    driver: bridge
    internal: true
  clone_control:
    driver: bridge
    internal: true
  clone_data:
    driver: bridge
    internal: true

volumes:
  source_data:
  repository_data:
