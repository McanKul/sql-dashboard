name: postgresql-advisor

services:
  source-db:
    build:
      context: .
      dockerfile: deployment/postgres/Dockerfile
    image: postgresql-advisor/powa-postgres:17-5.2.0
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-advisor_dev_admin}
      POWA_COLLECTOR_PASSWORD: ${POWA_COLLECTOR_PASSWORD:-advisor_dev_collector}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - compute_query_id=on
      - -c
      - pg_stat_statements.track=all
      - -c
      - pg_stat_statements.max=10000
      - -c
      - pg_stat_statements.save=on
      - -c
      - track_io_timing=on
      - -c
      - powa.ignored_users=powa_collector
    ports:
      - "${SOURCE_DB_BIND:-127.0.0.1}:${SOURCE_DB_PORT:-5432}:5432"
    volumes:
      - source_data:/var/lib/postgresql/data
      - ./deployment/source/init-source.sh:/docker-entrypoint-initdb.d/10-init-source.sh:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appdb -p 5432 && psql -U postgres -d powa -Atqc \"SELECT extversion FROM pg_extension WHERE extname='powa'\" | grep -q '^5.2.0$'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    networks: [advisor]

  repository-db:
    build:
      context: .
      dockerfile: deployment/postgres/Dockerfile
    image: postgresql-advisor/powa-postgres:17-5.2.0
    environment:
      PGPORT: 5433
      POSTGRES_DB: powa_repository
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-advisor_dev_admin}
      POWA_COLLECTOR_PASSWORD: ${POWA_COLLECTOR_PASSWORD:-advisor_dev_collector}
      ADVISOR_API_PASSWORD: ${ADVISOR_API_PASSWORD:-advisor_dev_api}
      REGISTER_DEMO_SOURCE: ${REGISTER_DEMO_SOURCE:-true}
      # register-source preflight/prepare psql komutlari icin; PGSSLMODE adi
      # kullanilmaz, aksi halde repository healthcheck baglantisi da etkilenir.
      POWA_SOURCE_SSLMODE: ${POWA_SOURCE_SSLMODE:-prefer}
    command: ["postgres", "-p", "5433"]
    ports:
      - "${REPOSITORY_DB_BIND:-127.0.0.1}:${REPOSITORY_DB_PORT:-5433}:5433"
    volumes:
      - repository_data:/var/lib/postgresql/data
      - ./deployment/repository/init-repository.sh:/docker-entrypoint-initdb.d/10-init-repository.sh:ro,Z
      - ./sql/001_advisor_schema.sql:/docker-entrypoint-initdb.d/20-advisor-schema.sql:ro,Z
      - ./sql/002_prepare_remote_source.sql:/opt/advisor/sql/002_prepare_remote_source.sql:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d powa_repository -p 5433 && psql -U postgres -d powa_repository -p 5433 -Atqc \"SELECT extversion FROM pg_extension WHERE extname='powa'\" | grep -q '^5.2.0$'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [advisor]

  collector:
    build:
      context: .
      dockerfile: deployment/collector/Dockerfile
    image: postgresql-advisor/powa-collector:1.3.2
    environment:
      POWA_COLLECTOR_PASSWORD: ${POWA_COLLECTOR_PASSWORD:-advisor_dev_collector}
      # Repository Docker aginda SSL kullanmaz; dis kaynaklar ortak libpq
      # sslmode ayarini kullanir. Uretimde kaynaklar TLS ise require/verify-full.
      POWA_REPOSITORY_DSN: postgresql://powa_collector@repository-db:5433/powa_repository?sslmode=disable
      PGSSLMODE: ${POWA_SOURCE_SSLMODE:-prefer}
      POWA_SOURCE_HOST: source-db
      POWA_SOURCE_PORT: "5432"
      POWA_SOURCE_DB: powa
      POWA_REPOSITORY_HOST: repository-db
      POWA_REPOSITORY_PORT: "5433"
      POWA_REPOSITORY_DB: powa_repository
    volumes:
      - ./runtime/collector/sources:/run/advisor-source-secrets:ro,Z
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      source-db:
        condition: service_healthy
      repository-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,signal; os.kill(1, signal.SIGCONT)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks: [advisor]

  api:
    build:
      context: ./backend
    image: postgresql-advisor/api:iteration-1
    environment:
      DATABASE_URL: postgresql://advisor_api:${ADVISOR_API_PASSWORD:-advisor_dev_api}@repository-db:5433/powa_repository
      DEFAULT_WINDOW: ${DEFAULT_WINDOW:-24h}
      MAX_QUERY_PAGE_SIZE: "200"
      RETENTION_DAYS: ${RETENTION_DAYS:-90}
      SQL_TEXT_VISIBILITY: authorized
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      repository-db:
        condition: service_healthy
      collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    networks: [advisor]

  workload:
    build:
      context: ./deployment/workload
    image: postgresql-advisor/workload:iteration-1
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_ADMIN_PASSWORD:-advisor_dev_admin}@source-db:5432/appdb
      WORKLOAD_INTERVAL_SECONDS: "2"
    depends_on:
      source-db:
        condition: service_healthy
    profiles: [demo]
    restart: unless-stopped
    networks: [advisor]

  web:
    build:
      context: ./frontend
    image: postgresql-advisor/web:iteration-1
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped
    networks: [advisor]

networks:
  advisor:
    driver: bridge

volumes:
  source_data:
  repository_data:
